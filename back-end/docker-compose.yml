services:
  web:
    build: .
    container_name: car_marketplace_api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=car_marketplace.settings
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0

    ports:
      - "8000:8000"

    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/cars/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
